\* SPEC: GoChanCheck.tla
\* EXPECT: pass
\* WHY: with nobody receiving, a sender blocked on the full buffer is woken by close and panics: every goroutine still finishes
\*
\* a1 and a2 fill the buffer, a3 blocks; no receiver ever frees a slot, so a3
\* can only finish because close makes its send proceed (and panic). A GoChan
\* in which close did not wake blocked senders deadlocks here.
CONSTANTS
    Senders   = {a1, a2, a3}
    Receivers = {}
    Closers   = {k1, k2}
    Cap       = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    FIFO
    SendPanicsOnlyIfClosed
    NoSendAfterClose
    RangeEndsOnlyWhenDrained
    BlockedSenderPanics
    OneCloseSucceeds

PROPERTIES
    Termination
