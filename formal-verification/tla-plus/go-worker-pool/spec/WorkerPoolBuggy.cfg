\* SPEC: WorkerPoolBuggy.tla
\* EXPECT: safety NoPanic
\* WHY: Shutdown can close p.jobs between Submit's closed check and its send -> "send on closed channel"
\*
\* Same constants as WorkerPoolFixed.cfg: only the spec differs.
CONSTANTS
    Clients         = {c1, c2}
    ShutdownCallers = {s1, s2}
    Workers         = {w1}
    QueueSize       = 1
    NoJob           = NoJob

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoPanic
    HandledAtMostOnce
    HandledOnlyIfAccepted
    ShutdownDrains
    RejectOnlyAfterShutdown

PROPERTIES
    Termination
    AcceptedEventuallyHandled
