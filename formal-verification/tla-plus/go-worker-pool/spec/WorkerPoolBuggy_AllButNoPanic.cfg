\* SPEC: WorkerPoolBuggy.tla
\* EXPECT: pass
\* WHY: the panic is the buggy pool's only failure: every other property holds (a panicking Submit never accepted its job)
\*
\* In the model a panicking goroutine just stops (as if its caller recovered,
\* which is what the replay test does); in production it kills the process.
CONSTANTS
    Clients         = {c1, c2}
    ShutdownCallers = {s1, s2}
    Workers         = {w1}
    QueueSize       = 1
    NoJob           = NoJob

SPECIFICATION Spec

INVARIANTS
    TypeOK
    HandledAtMostOnce
    HandledOnlyIfAccepted
    ShutdownDrains
    RejectOnlyAfterShutdown

PROPERTIES
    Termination
    AcceptedEventuallyHandled
