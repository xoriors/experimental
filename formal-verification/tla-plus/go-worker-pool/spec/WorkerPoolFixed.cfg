\* SPEC: WorkerPoolFixed.tla
\* EXPECT: pass
\* WHY: the fix is panic-free, loses no accepted job, never deadlocks and always terminates (small scope)
\*
\* Two clients race two Shutdown calls (concurrent + repeated Shutdown) on a
\* one-slot queue with one worker: enough for a sender to be admitted, blocked
\* on a full buffer, and still in flight when Shutdown marks the pool closed.
CONSTANTS
    Clients         = {c1, c2}
    ShutdownCallers = {s1, s2}
    Workers         = {w1}
    QueueSize       = 1
    NoJob           = NoJob

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoPanic
    HandledAtMostOnce
    HandledOnlyIfAccepted
    ShutdownDrains
    RejectOnlyAfterShutdown

PROPERTIES
    Termination
    AcceptedEventuallyHandled
