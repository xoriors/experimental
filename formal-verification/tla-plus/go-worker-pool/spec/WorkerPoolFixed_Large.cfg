\* SPEC: WorkerPoolFixed.tla
\* EXPECT: pass
\* WHY: the fix still holds with 4 clients, 2 Shutdown callers, 2 workers and a 2-slot queue (safety + termination)
\*
\* AcceptedEventuallyHandled is left to the small models: under Spec it follows
\* from Termination (every Shutdown call returns) plus the ShutdownDrains
\* invariant, WorkerPoolFixed_ShutdownOptional.cfg checks it without assuming
\* Shutdown is ever called, and checking it here would multiply the
\* liveness-checking time.
CONSTANTS
    Clients         = {c1, c2, c3, c4}
    ShutdownCallers = {s1, s2}
    Workers         = {w1, w2}
    QueueSize       = 2
    NoJob           = NoJob

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoPanic
    HandledAtMostOnce
    HandledOnlyIfAccepted
    ShutdownDrains
    RejectOnlyAfterShutdown

PROPERTIES
    Termination
