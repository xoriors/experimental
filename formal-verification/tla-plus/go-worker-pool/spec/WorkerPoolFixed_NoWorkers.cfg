\* SPEC: WorkerPoolFixed.tla
\* EXPECT: deadlock
\* WHY: sanity check that TLC's deadlock detection fires on this spec: with no worker a full queue blocks Submit and Shutdown forever
\*
\* c1 fills the one-slot queue, c2 is admitted and blocks on the full queue,
\* Shutdown waits in p.senders.Wait() for c2: every goroutine is blocked.
\* This is why New rejects workers < 1.
CONSTANTS
    Clients         = {c1, c2}
    ShutdownCallers = {s1}
    Workers         = {}
    QueueSize       = 1
    NoJob           = NoJob

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoPanic
    HandledAtMostOnce
    HandledOnlyIfAccepted
    ShutdownDrains
    RejectOnlyAfterShutdown
