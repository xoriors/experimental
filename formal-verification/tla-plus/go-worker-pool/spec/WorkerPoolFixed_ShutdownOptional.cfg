\* SPEC: WorkerPoolFixedProbes.tla
\* EXPECT: pass
\* WHY: a running pool handles every accepted job without anyone calling Shutdown (no fairness for the Shutdown callers)
\*
\* WorkerPoolFixed.cfg checks AcceptedEventuallyHandled under Spec, where
\* Shutdown is eventually called; there it follows from Termination +
\* ShutdownDrains. This model checks it on its own: SpecShutdownOptional lets
\* the Shutdown callers run, but does not force them to.
CONSTANTS
    Clients         = {c1, c2}
    ShutdownCallers = {s1, s2}
    Workers         = {w1}
    QueueSize       = 1
    NoJob           = NoJob

SPECIFICATION SpecShutdownOptional

PROPERTIES
    AcceptedEventuallyHandled
