\* SPEC: WorkerPoolQuit.tla
\* EXPECT: safety ShutdownDrains
\* WHY: select picks a ready case at random, so Submit can accept a job after the workers drained and exited: lost work
\*
\* Same constants as WorkerPoolBuggy.cfg / WorkerPoolFixed.cfg.
CONSTANTS
    Clients         = {c1, c2}
    ShutdownCallers = {s1, s2}
    Workers         = {w1}
    QueueSize       = 1
    NoJob           = NoJob

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoPanic
    HandledAtMostOnce
    HandledOnlyIfAccepted
    ShutdownDrains
    RejectOnlyAfterShutdown

PROPERTIES
    Termination
    AcceptedEventuallyHandled
