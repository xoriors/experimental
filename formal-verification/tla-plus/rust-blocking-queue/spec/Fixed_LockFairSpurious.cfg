\* SPEC: BlockingQueueFixed.tla
\* EXPECT: liveness
\* WHY: MUTATION (weakened fairness): under F1 alone a thread that keeps waking spuriously and re-waiting can hog the Mutex forever, so Progress fails
CONSTANTS
    Producers = {"p1", "p2"}
    Consumers = {"c1", "c2"}
    Capacity  = 1
    Spurious  = TRUE
SPECIFICATION SpecLockFair
INVARIANT TypeOK NoDeadlock
PROPERTY Progress
