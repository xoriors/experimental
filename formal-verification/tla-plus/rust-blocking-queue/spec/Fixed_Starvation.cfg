\* SPEC: BlockingQueueFixed.tla
\* EXPECT: liveness
\* WHY: NOT a property of the fixed queue: under F2 a woken producer can lose the Mutex to another producer and re-wait forever (starvation)
CONSTANTS
    Producers = {"p1", "p2"}
    Consumers = {"c1"}
    Capacity  = 1
    Spurious  = FALSE
SPECIFICATION SpecThreadFair
INVARIANT TypeOK NoDeadlock
PROPERTY NoStarvation
