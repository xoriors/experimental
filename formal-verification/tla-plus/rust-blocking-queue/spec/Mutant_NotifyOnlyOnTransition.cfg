\* SPEC: BlockingQueueTransitionMutant.tla
\* EXPECT: safety ConsumerAwake
\* WHY: MUTATION: notify only when the queue was empty (put) / full (take) loses wakeups; it passes NoDeadlock, Progress and a 'some consumer is awake' invariant, so ConsumerAwake must count awake consumers to catch it
CONSTANTS
    Producers = {"p1"}
    Consumers = {"c1", "c2"}
    Capacity  = 2
    Spurious  = FALSE
SPECIFICATION Spec
INVARIANT TypeOK BoundedBuffer NoDeadlock ConsumerAwake ProducerAwake
