\* SPEC: BlockingQueueNotifyAll.tla
\* EXPECT: liveness
\* WHY: the most a lock can promise (strong fairness on each thread's critical section) is no better than F2 here: a producer that gets the Mutex every round can still find the queue full every time
CONSTANTS
    Producers = {"p1", "p2"}
    Consumers = {"c1"}
    Capacity  = 1
    Spurious  = FALSE
SPECIFICATION SpecThreadStrongFair
INVARIANT TypeOK NoDeadlock
PROPERTY NoStarvation
