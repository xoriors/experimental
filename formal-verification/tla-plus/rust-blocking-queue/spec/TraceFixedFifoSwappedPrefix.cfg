\* SPEC: TraceFixedFifoSwapped.tla
\* EXPECT: safety MatchedFewerThanLimit
\* WHY: the FIFO rejection is not vacuous: records 1..14 do match, so TLC fails exactly at the FIFO check of record 15
CONSTANTS
    Variant   = "fixed"
    Spurious  = TRUE
    Producers <- TraceProducers
    Consumers <- TraceConsumers
    Capacity  <- TraceCapacity
    Blocked   <- TraceBlocked
    Log       <- TraceLog
    MatchLimit = 14
INIT TraceInit
NEXT TraceNext
INVARIANT MatchedFewerThanLimit
CHECK_DEADLOCK FALSE
