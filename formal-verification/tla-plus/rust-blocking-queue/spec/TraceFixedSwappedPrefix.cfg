\* SPEC: TraceFixedSwapped.tla
\* EXPECT: safety MatchedFewerThanLimit
\* WHY: the rejection is not vacuous: records 1..9 do match (the swapped-in put is still possible), so TLC fails exactly at record 10
CONSTANTS
    Variant   = "fixed"
    Spurious  = TRUE
    Producers <- TraceProducers
    Consumers <- TraceConsumers
    Capacity  <- TraceCapacity
    Blocked   <- TraceBlocked
    Log       <- TraceLog
    MatchLimit = 9
INIT TraceInit
NEXT TraceNext
INVARIANT MatchedFewerThanLimit
CHECK_DEADLOCK FALSE
