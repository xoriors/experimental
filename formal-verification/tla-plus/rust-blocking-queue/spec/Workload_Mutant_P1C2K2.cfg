\* SPEC: BlockingQueueWorkload.tla
\* EXPECT: safety NoHang
\* WHY: the notify-on-transition mutant hangs a balanced program: 1 producer x 2 items, 2 consumers x 1 take, capacity 2; the consumer that was never woken sleeps next to the last item
CONSTANTS
    Variant   = "transition_mutant"
    Producers = {"p1"}
    Consumers = {"c1", "c2"}
    Capacity  = 2
    Items     = 2
    Takes     = 1
    Spurious  = FALSE
SPECIFICATION WSpec
INVARIANT TypeOK BoundedBuffer NoHang
