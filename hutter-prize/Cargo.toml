[package]
name = "hutter-lab"
version = "0.1.0"
edition = "2024"
description = "Measurement workbench for Hutter Prize ideas: enwik9 structure, a context-mixing proxy model with a real arithmetic coder, and pluggable side models"
license = "Apache-2.0"
publish = false

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 3
